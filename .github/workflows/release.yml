name: release

# 打 tag（v*）时自动构建 Windows / Linux / macOS 产物并发布 Release。
# 手动触发时走 draft，方便先检查产物。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.1，留空则用 VERSION 文件）'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 解析版本
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V="$(tr -d '\r\n' < VERSION)"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "版本: $V"

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 静态检查
        run: |
          test -z "$(gofmt -l internal cmd)" || { gofmt -l internal cmd; exit 1; }
          go vet ./...

      - name: 交叉编译
        env:
          V: ${{ steps.ver.outputs.version }}
          C: ${{ steps.ver.outputs.commit }}
          T: ${{ steps.ver.outputs.built }}
        run: |
          set -e
          LD="-s -w -X main.version=$V -X main.commit=$C -X main.buildTime=$T"
          mkdir -p dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%%/*}"; arch="${target##*/}"
            out="dist/zixin-transfer-${os}-${arch}"
            [ "$os" = windows ] && out="$out.exe"
            echo "==> $os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LD" -o "$out" ./cmd/zixin-transfer
          done
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: 子欣互传 v${{ steps.ver.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            dist/zixin-transfer-*
            dist/SHA256SUMS.txt
