# 子欣互传 反向代理配置
# 放到 /etc/nginx/sites-available/zixin-transfer.conf，然后：
#   ln -s /etc/nginx/sites-available/zixin-transfer.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 把 send.example.com 换成你自己的域名。证书用 certbot 自动签发。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name send.example.com;

    # certbot 自动续期需要 /.well-known
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name send.example.com;

    ssl_certificate     /etc/letsencrypt/live/send.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/send.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 大文件传输：不限请求体，长连接不超时
    client_max_body_size 0;
    client_body_timeout 3600s;
    send_timeout 3600s;

    # 安全响应头（页面是自带 UI 的单页应用，不需要外链资源）
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket 信令必须升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接 / 大文件
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
